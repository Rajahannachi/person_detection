<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Person Detection</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1d2330; --muted: #6b7280; --border: #e2e5ea;
    --accent: #1f8a4c; --accent-hover: #18713e; --danger: #c0392b; --view: #111418;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a; --panel: #1b1f26; --text: #e6e8eb; --muted: #9aa3ae; --border: #2b313a;
      --accent: #2fa462; --accent-hover: #38b86e; --danger: #e05a4b; --view: #0b0d10;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--border); color: var(--muted); }
  .tabs { margin-left: auto; display: flex; gap: 4px; }
  .tab { border: 1px solid var(--border); background: transparent; color: var(--text); padding: 6px 14px; border-radius: 8px; cursor: pointer; font: inherit; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { display: grid; grid-template-columns: 300px 1fr; gap: 16px; padding: 16px 20px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; padding: 16px; } header { flex-wrap: wrap; } .tabs { margin-left: 0; } }
  aside { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  label { display: block; margin: 8px 0 4px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  select, input[type=file] { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .check input { accent-color: var(--accent); }
  button.primary, button.secondary { width: 100%; font: inherit; padding: 9px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  button.primary { background: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button.secondary { background: transparent; color: var(--danger); border-color: var(--danger); margin-top: 8px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; }
  .stats b { font-variant-numeric: tabular-nums; }
  .view { background: var(--view); border-radius: 10px; min-height: 420px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .view img { max-width: 100%; max-height: 75vh; display: block; }
  .hint { color: #8a929c; padding: 24px; text-align: center; }
  .progress { height: 6px; background: var(--border); border-radius: 3px; margin-top: 10px; overflow: hidden; }
  .progress div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .status { margin-top: 8px; color: var(--muted); }
  .status a { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  td.num { font-variant-numeric: tabular-nums; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Person and object detection</h1>
  <span class="badge" id="model">yolo26n</span>
  <nav class="tabs">
    <button class="tab active" data-tab="video">Video</button>
    <button class="tab" data-tab="image">Image</button>
  </nav>
</header>

<main>
  <aside>
    <!-- Video source -->
    <section class="card" data-panel="video">
      <h2>Video</h2>
      <select id="videoSelect"></select>
      <label for="videoUpload">Add a video</label>
      <input type="file" id="videoUpload" accept="video/*">
    </section>

    <!-- Image source -->
    <section class="card hidden" data-panel="image">
      <h2>Image</h2>
      <input type="file" id="imageFile" accept="image/*">
    </section>

    <section class="card">
      <h2>Options</h2>
      <label for="imgsz">Image size</label>
      <select id="imgsz">
        <option>320</option><option>416</option><option>480</option><option selected>640</option><option>960</option>
      </select>
      <div class="row"><label for="conf">Confidence</label><b id="confVal">0.25</b></div>
      <input type="range" id="conf" min="0.05" max="0.95" step="0.05" value="0.25">
      <div class="check"><input type="checkbox" id="personsOnly"><label for="personsOnly" style="margin:0">Persons only</label></div>
      <div class="check" data-panel="video"><input type="checkbox" id="save" checked><label for="save" style="margin:0">Save the annotated video</label></div>
    </section>

    <section data-panel="video">
      <button class="primary" id="startBtn">▶ Start detection</button>
      <button class="secondary" id="stopBtn" disabled>■ Stop</button>
    </section>
    <section class="hidden" data-panel="image">
      <button class="primary" id="imageBtn" disabled>▶ Detect</button>
    </section>

    <section class="card">
      <h2>Statistics</h2>
      <div class="stats" id="stats"></div>
    </section>
  </aside>

  <section>
    <div class="view" id="view"><div class="hint" id="hint">Choose a video, then click “Start detection”.</div></div>
    <div class="progress" data-panel="video"><div id="bar"></div></div>
    <div class="status" id="status">Ready.</div>
    <div id="detTable"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let tab = "video", poller = null, lastImage = null;

// ---------------------------------------------------------------- helpers
function setStats(rows) {
  $("stats").innerHTML = rows.map(([k, v]) => `<span>${k}</span><b>${v}</b>`).join("");
}
function setView(src) {
  const view = $("view");
  view.innerHTML = src ? `<img id="viewImg" alt="result">` : `<div class="hint">${tab === "video"
      ? "Choose a video, then click “Start detection”."
      : "Choose an image, then click “Detect”."}</div>`;
  if (src) $("viewImg").src = src;
}
function params() {
  return { conf: parseFloat($("conf").value), imgsz: parseInt($("imgsz").value), persons_only: $("personsOnly").checked };
}
async function api(url, opts) {
  const r = await fetch(url, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || r.statusText);
  return data;
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------------------------------------------------------------- tabs
document.querySelectorAll(".tab").forEach((b) => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t === b));
  document.querySelectorAll("[data-panel]").forEach((p) => p.classList.toggle("hidden", p.dataset.panel !== tab));
  $("detTable").innerHTML = "";
  if (tab === "image") {
    setView(lastImage ? lastImage.image : null);
    if (lastImage) showImageResult(lastImage); else { setStats(defaultStats()); $("status").textContent = "Ready."; }
  } else {
    setView(null); setStats(defaultStats()); refreshStatus();
  }
});
const defaultStats = () => [["Persons", "–"], ["Objects", "–"], ["Inference", "–"], [tab === "video" ? "Average FPS" : "Size", "–"], ...(tab === "video" ? [["Frame", "–"]] : [])];

$("conf").oninput = () => $("confVal").textContent = parseFloat($("conf").value).toFixed(2);

// ---------------------------------------------------------------- video
async function loadVideos(select) {
  const vids = await api("/api/videos");
  $("videoSelect").innerHTML = vids.length
    ? vids.map((v) => `<option value="${esc(v.name)}">${esc(v.name)} (${v.size_mb} Mo)</option>`).join("")
    : `<option value="">No video in input_videos</option>`;
  if (select) $("videoSelect").value = select;
}

$("videoUpload").onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  $("status").textContent = `Uploading ${f.name} …`;
  const fd = new FormData(); fd.append("file", f);
  try {
    const r = await api("/api/videos", { method: "POST", body: fd });
    await loadVideos(r.name);
    $("status").textContent = `${r.name} added.`;
  } catch (err) { $("status").textContent = "Error: " + err.message; }
  e.target.value = "";
};

$("startBtn").onclick = async () => {
  const video = $("videoSelect").value;
  if (!video) { $("status").textContent = "Add a video first."; return; }
  try {
    await api("/api/video/start", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ video, save: $("save").checked, ...params() }) });
    setView("/api/video/stream?t=" + Date.now());
    $("bar").style.width = "0";
    startPolling();
  } catch (err) { $("status").textContent = "Error: " + err.message; }
};
$("stopBtn").onclick = () => api("/api/video/stop", { method: "POST" });

function renderStatus(s) {
  const i = s.info || {};
  $("startBtn").disabled = s.running;
  $("stopBtn").disabled = !s.running;
  if (tab !== "video") return;
  $("status").innerHTML = esc(s.status) + (s.output && !s.running
    ? ` — <a href="/api/outputs/${encodeURIComponent(s.output)}">download ${esc(s.output)}</a>` : "");
  if (i.frame) {
    setStats([["Persons", i.persons], ["Objects", i.objects], ["Inference", `${Math.round(i.infer_ms)} ms`],
              ["Average FPS", i.avg_fps.toFixed(1)], ["Frame", `${i.frame} / ${i.total > 0 ? i.total : "?"}`]]);
    if (i.total > 0) $("bar").style.width = (i.frame / i.total * 100) + "%";
  }
}
async function refreshStatus() {
  const s = await api("/api/video/status");
  renderStatus(s);
  return s;
}
function startPolling() {
  clearInterval(poller);
  poller = setInterval(async () => {
    const s = await refreshStatus().catch(() => null);
    if (s && !s.running) clearInterval(poller);
  }, 400);
}

// ---------------------------------------------------------------- image
$("imageFile").onchange = (e) => {
  const f = e.target.files[0];
  $("imageBtn").disabled = !f;
  if (f) { setView(URL.createObjectURL(f)); $("detTable").innerHTML = ""; setStats(defaultStats()); $("status").textContent = f.name; }
};

$("imageBtn").onclick = async () => {
  const f = $("imageFile").files[0];
  if (!f) return;
  const p = params(), fd = new FormData();
  fd.append("file", f);
  Object.entries(p).forEach(([k, v]) => fd.append(k, v));
  $("imageBtn").disabled = true;
  $("status").textContent = "Detecting …";
  try {
    lastImage = await api("/api/image", { method: "POST", body: fd });
    lastImage.name = f.name;
    if (tab === "image") { setView(lastImage.image); showImageResult(lastImage); }
  } catch (err) { $("status").textContent = "Error: " + err.message; }
  $("imageBtn").disabled = false;
};

function showImageResult(r) {
  setStats([["Persons", r.persons], ["Objects", r.objects], ["Inference", `${Math.round(r.infer_ms)} ms`], ["Size", `${r.width}×${r.height}`]]);
  const base = r.name ? r.name.replace(/\.[^.]+$/, "") : "image";
  $("status").innerHTML = `${r.detections.length} detection(s) — <a href="${r.image}" download="${esc(base)}_detected.jpg">download the annotated image</a>`;
  $("detTable").innerHTML = r.detections.length ? `<table><thead><tr><th>Class</th><th>Confidence</th><th>Box (x1, y1, x2, y2)</th></tr></thead><tbody>${
    r.detections.map((d) => `<tr><td>${esc(d.label)}</td><td class="num">${(d.conf * 100).toFixed(0)} %</td><td class="num">${d.box.join(", ")}</td></tr>`).join("")
  }</tbody></table>` : "";
}

// ---------------------------------------------------------------- init
api("/api/info").then((i) => $("model").textContent = i.model).catch(() => {});
setStats(defaultStats());
loadVideos().catch(() => {});
refreshStatus().then((s) => { if (s.running) { setView("/api/video/stream?t=" + Date.now()); startPolling(); } }).catch(() => {});
</script>
</body>
</html>
